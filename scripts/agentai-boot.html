<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AgentAI Boot</title>
<style>
body { background: #0a0a14; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.loader { text-align: center; }
.spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #c084fc; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.ok { color: #4ade80; }
.err { color: #f87171; }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p id="status">Configurando Lia...</p>
</div>
<script>
// agentai-boot.html - Configura providers E modulos do AIRI (beta)
// Injetado na URL pelo atualizar_airi.ps1. Params:
//   brain      = base do cerebro (PADRAO: bridge local http://127.0.0.1:9860/cerebro/v1/).
//                O bridge repassa pro tunel do Colab sozinho (le api_url.txt/ultima_url.txt),
//                por isso usamos "URL FIXA" — o tunel pode mudar sem reconfigurar o AIRI.
//   model      = nome do modelo do cerebro (padrao 'agentai')
//   voice      = string de voz (ex.: 'pt-BR-ThalitaNeural', 'kokoro:pf_dora@1.05', 'sovits:minha_voz')
//   voiceBase  = base do TTS (padrao http://127.0.0.1:9860/v1/)
//   speechModel= nome do modelo TTS p/ a chave speech/active-model (auto se omitido)

const params = new URLSearchParams(window.location.search);
const brainUrl = params.get('brain') || 'http://127.0.0.1:9860/cerebro/v1/';
const brainModel = params.get('model') || 'agentai';
const voice = params.get('voice') || 'pt-BR-ThalitaNeural';
const voiceBase = params.get('voiceBase') || 'http://127.0.0.1:9860/v1/';
// O engine é detectado pelo PREFIXO do nome da voz (o gateway roteia por ele).
// sovits:  -> 'sovits' (legado) · qwen3:/cosyvoice3: -> o próprio engine ·
// edge:    -> 'edge-tts' (padrão).
const speechModel = params.get('speechModel') || (
  voice.startsWith('sovits:') ? 'sovits'
  : voice.startsWith('qwen3:') ? 'qwen3'
  : voice.startsWith('qwen:') ? 'qwen3'
  : voice.startsWith('cosyvoice3:') ? 'cosyvoice3'
  : 'edge-tts'
);
const statusEl = document.getElementById('status');

function setStatus(msg, ok) {
  statusEl.textContent = msg;
  statusEl.className = ok ? 'ok' : 'err';
}

// Ids dos providers que a Lia usa (iguais aos do CDP em lia/airi/inject.py).
const BRAIN_PROVIDER = 'openai-compatible';
const SPEECH_PROVIDER = 'openai-compatible-audio-speech';

try {
  let configured = {};
  let added = {};
  try { configured = JSON.parse(localStorage.getItem('settings/providers/configured') || '{}'); } catch(e) {}
  try { added = JSON.parse(localStorage.getItem('settings/providers/added') || '{}'); } catch(e) {}

  // Remove o provider legado (openai oficial) — usamos os compatíveis locais.
  delete configured['openai-audio-speech'];
  delete added['openai-audio-speech'];

  // Cérebro (chat): openai-compatible apontando para o túnel via bridge.
  if (brainUrl) {
    configured[BRAIN_PROVIDER] = {
      id: BRAIN_PROVIDER, definitionId: BRAIN_PROVIDER,
      config: { apiKey: 'local', baseUrl: brainUrl.endsWith('/') ? brainUrl : brainUrl + '/' },
      status: 'configured', configuredBy: 'user'
    };
    added[BRAIN_PROVIDER] = true;
  }

  // Voz (TTS): openai-compatible-audio-speech (aceita qualquer voz).
  configured[SPEECH_PROVIDER] = {
    id: SPEECH_PROVIDER, definitionId: SPEECH_PROVIDER,
    config: { apiKey: 'local', baseUrl: voiceBase.endsWith('/') ? voiceBase : voiceBase + '/' },
    status: 'configured', configuredBy: 'user'
  };
  added[SPEECH_PROVIDER] = true;

  localStorage.setItem('settings/providers/configured', JSON.stringify(configured));
  localStorage.setItem('settings/providers/added', JSON.stringify(added));

  // Módulo de VOZ (speech).
  localStorage.setItem('settings/speech/active-provider', SPEECH_PROVIDER);
  localStorage.setItem('settings/speech/active-model', speechModel);
  localStorage.setItem('settings/speech/voice', voice);

  // Módulo de CONSCIÊNCIA (cérebro) — importante na beta: default é '' e deixa 'adicionado' sem 'ativo'.
  localStorage.setItem('settings/consciousness/active-provider', BRAIN_PROVIDER);
  localStorage.setItem('settings/consciousness/active-model', brainModel);
  localStorage.removeItem('settings/consciousness/active-custom-model');

  // Módulo de VISÃO (VLM) — usa o mesmo provider de chat.
  localStorage.setItem('settings/vision/active-provider', BRAIN_PROVIDER);
  localStorage.setItem('settings/vision/active-model', brainModel);
  localStorage.removeItem('settings/vision/active-custom-model');

  setStatus('OK! Voz: ' + voice + ' (' + speechModel + ') · Cérebro: ' + brainModel, true);
  setTimeout(() => { window.location.href = '/'; }, 1500);
} catch(e) {
  setStatus('Erro: ' + e.message, false);
}
</script>
</body>
</html>
